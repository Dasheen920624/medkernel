# MedKernel nginx 站点模板（HTTPS 443/8443 + SPA + /medkernel/ 反代后端）
# 安装：cp 到 /etc/nginx/conf.d/medkernel.conf → nginx -t → systemctl reload nginx
# 证书：自签或正式证书放 /zoesoft/medkernel/nginx/ssl/server.{crt,key}
#   自签示例：openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#             -keyout server.key -out server.crt -subj "/CN=medkernel"
upstream medkernel_backend {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8088;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    listen 8443 ssl;
    server_name _;
    charset utf-8;
    root /zoesoft/medkernel/frontend/dist;
    index index.html;

    ssl_certificate     /zoesoft/medkernel/nginx/ssl/server.crt;
    ssl_certificate_key /zoesoft/medkernel/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /embed/launch {
        try_files /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    location /medkernel/ {
        proxy_pass http://medkernel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_pass_header X-Trace-Id;
    }

    location = /healthz {
        access_log off;
        proxy_set_header Host $host;
        proxy_pass http://medkernel_backend/medkernel/actuator/health;
    }
}
