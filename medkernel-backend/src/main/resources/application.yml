# MedKernel v1.0 GA · 默认 application.yml
# 详细 profile 详见 application-{dev,test,container,govcloud}.yml
spring:
  application:
    name: medkernel
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: console
  threads:
    virtual:
      enabled: true     # Spring Boot 3.2+ Virtual Threads 默认开启
  flyway:
    enabled: false      # 默认由具体 profile 打开迁移
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:18080}
  servlet:
    context-path: /medkernel
  tomcat:
    threads:
      max: 200
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.medkernel: DEBUG

medkernel:
  api:
    idempotency:
      enabled: ${MEDKERNEL_API_IDEMPOTENCY_ENABLED:true}
      ttl: ${MEDKERNEL_API_IDEMPOTENCY_TTL:24h}
  events:
    max-payload-size-bytes: ${MEDKERNEL_EVENTS_MAX_PAYLOAD_SIZE_BYTES:1048576}
    sync-timeout: ${MEDKERNEL_EVENTS_SYNC_TIMEOUT:3s}
    worker-batch-size: ${MEDKERNEL_EVENTS_WORKER_BATCH_SIZE:50}
    max-retries: ${MEDKERNEL_EVENTS_MAX_RETRIES:5}
    worker-enabled: ${MEDKERNEL_EVENTS_WORKER_ENABLED:true}
    backoff-seconds:
      - 5
      - 30
      - 300
      - 1800
    worker-poll-interval-ms: ${MEDKERNEL_EVENTS_WORKER_POLL_INTERVAL_MS:200}
  cdss:
    realtime:
      default-timeout: ${MEDKERNEL_CDSS_REALTIME_DEFAULT_TIMEOUT:2s}
      order-sign-timeout: ${MEDKERNEL_CDSS_REALTIME_ORDER_SIGN_TIMEOUT:1s}
  integration:
    health-probe-interval-ms: ${MEDKERNEL_INTEGRATION_HEALTH_PROBE_INTERVAL_MS:300000}
    secret-key: ${MEDKERNEL_INTEGRATION_SECRET_KEY:}
  auth:
    mfa:
      enabled: ${MEDKERNEL_AUTH_MFA_ENABLED:false}
    jwt:
      ttl-seconds: 28800
      secret: ${MEDKERNEL_AUTH_JWT_SECRET:}
    cookie:
      name: mk_access
      secure: false   # 生产/govcloud profile 覆盖为 true
      same-site: Strict
      path: /medkernel
      max-age-seconds: 28800
    session:
      idle-timeout-seconds: 1800
      warning-seconds: 120
      max-duration-seconds: 28800
  runtime:
    environment: ${MEDKERNEL_RUNTIME_ENV:dev}
    deployment-mode: ${MEDKERNEL_DEPLOYMENT_MODE:local}
    database-dialect: ${MEDKERNEL_DATABASE_DIALECT:h2}
    migration-location: ${MEDKERNEL_MIGRATION_LOCATION:classpath:db/migration/h2}
    release-fingerprint: ${MEDKERNEL_RUNTIME_RELEASE_FINGERPRINT:development}
    feature-flags:
      graph-projection:
        display-name: 知识图谱投影
        enabled: ${MEDKERNEL_GRAPH_ENABLED:false}
        risk: MEDIUM
        owner: 信息科 / 架构组
        description: 控制 Neo4j 图谱投影和图谱查询能力是否参与运行。
      search-projection:
        display-name: 知识搜索投影
        enabled: ${MEDKERNEL_SEARCH_ENABLED:false}
        risk: MEDIUM
        owner: 信息科 / 架构组
        description: 控制知识搜索索引投影是否参与运行，关闭时关系库权威主链路保持可用。
      dify-workflow:
        display-name: Dify 工作流
        enabled: ${MEDKERNEL_DIFY_ENABLED:false}
        risk: MEDIUM
        owner: AI 平台组
        description: 控制 Dify 工作流接入，关闭时系统保持本地基础能力。
      audit-persistence:
        display-name: 审计持久化
        enabled: ${MEDKERNEL_AUDIT_PERSISTENCE_ENABLED:true}
        risk: HIGH
        owner: 合规审计
        description: 控制审计事件落库与审计链写入，生产环境必须开启。
      external-provider:
        display-name: 外部 Provider 接入
        enabled: ${MEDKERNEL_EXTERNAL_PROVIDER_ENABLED:false}
        risk: HIGH
        owner: 信息科 / 集成组
        description: 控制外部 HIS、EMR、模型和时间戳 Provider 接入。
      domestic-crypto:
        display-name: 国密增强
        enabled: ${MEDKERNEL_DOMESTIC_CRYPTO_ENABLED:true}
        risk: HIGH
        owner: 安全组
        description: 控制 SM2、SM3、SM4 等国密算法能力是否纳入运行验收。
      authoring-recursive-condition-tree:
        display-name: 规则递归条件树
        enabled: ${MEDKERNEL_AUTHORING_RECURSIVE_CONDITION_TREE_ENABLED:true}
        risk: MEDIUM
        owner: 医务处 / 信息科
        description: 控制规则与路径条件是否允许嵌套条件组；关闭时单层条件继续可用。
      authoring-clinical-operators:
        display-name: 规则临床算子
        enabled: ${MEDKERNEL_AUTHORING_CLINICAL_OPERATORS_ENABLED:true}
        risk: HIGH
        owner: 医务处 / 信息科
        description: 控制区间、参考范围、单位、时序和受控公式等临床算子是否参与求值。
      authoring-batch-authoring:
        display-name: 批量创作
        enabled: ${MEDKERNEL_AUTHORING_BATCH_AUTHORING_ENABLED:true}
        risk: HIGH
        owner: 医务处 / 信息科
        description: 控制规则、路径和值集等资产的批量生成、导入、发布和分发入口。
      authoring-pathway-rich-nodes:
        display-name: 路径富节点
        enabled: ${MEDKERNEL_AUTHORING_PATHWAY_RICH_NODES_ENABLED:true}
        risk: HIGH
        owner: 医务处 / 信息科
        description: 控制决策、并行、等待计时、人工确认和医嘱集节点是否可发布与推进。
    backup:
      enabled: ${MEDKERNEL_BACKUP_ENABLED:false}
      rpo: ${MEDKERNEL_BACKUP_RPO:未启用}
      rto: ${MEDKERNEL_BACKUP_RTO:未启用}
      backup-script: ./deploy/docker/scripts/backup.sh
      restore-script: ./deploy/docker/scripts/restore.sh
      checksum-policy: SHA-256 摘要随备份文件生成，恢复前自动校验
      drill-evidence-file: ${MEDKERNEL_BACKUP_DRILL_EVIDENCE_FILE:}
    domestic-profile:
      target-os: 麒麟 / 统信 / openEuler
      target-jdk: KAE-JDK 21 / BiSheng JDK 21
      database-vendors:
        - 达梦
        - 人大金仓
      crypto-algorithms:
        - SM2
        - SM3
        - SM4
      evidence: 国产化自检、五方言迁移合同、国密算法 smoke
